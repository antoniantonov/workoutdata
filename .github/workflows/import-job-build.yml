name: Import Job - Build and Publish

on:
  push:
    branches:
      - master
    paths:
      - 'jobs/import/**'
      - 'polar/**'
      - 'data/**'
      - 'hr_data/zones.csv'
      - '.github/workflows/import-job-build.yml'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: humandcoded2
  ACR_LOGIN_SERVER: humandcoded2.azurecr.io
  IMAGE_REPOSITORY: polar-import-job

jobs:
  build-and-push:
    name: Build & push image
    runs-on: ubuntu-latest
    outputs:
      image_tag: ${{ steps.tag.outputs.image_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Compute image tag (1.0.YYMMDD.<build_number_for_the_day>)
        id: tag
        run: |
          set -euo pipefail
          DATE_PART=$(date -u +%y%m%d)
          PREFIX="1.0.${DATE_PART}."
          # Find the highest existing build number for today's date in ACR
          # and increment. Returns 0 if no tags exist yet.
          EXISTING=$(az acr repository show-tags \
            --name "${ACR_NAME}" \
            --repository "${IMAGE_REPOSITORY}" \
            --orderby time_desc \
            --top 200 \
            -o tsv 2>/dev/null \
            | grep -E "^${PREFIX//./\\.}[0-9]+$" \
            | sed -E "s/^${PREFIX//./\\.}//" \
            | sort -n | tail -1 || true)
          if [ -z "${EXISTING}" ]; then
            NEXT=1
          else
            NEXT=$((EXISTING + 1))
          fi
          IMAGE_TAG="${PREFIX}${NEXT}"
          echo "Computed image tag: ${IMAGE_TAG}"
          echo "image_tag=${IMAGE_TAG}" >> "$GITHUB_OUTPUT"

      - name: ACR Login
        run: az acr login --name "${ACR_NAME}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: jobs/import/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:${{ steps.tag.outputs.image_tag }}
            ${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:latest
          cache-from: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:buildcache
          cache-to: type=registry,ref=${{ env.ACR_LOGIN_SERVER }}/${{ env.IMAGE_REPOSITORY }}:buildcache,mode=max

      - name: Summary
        run: |
          echo "Pushed: ${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:${{ steps.tag.outputs.image_tag }}"
          echo "Pushed: ${ACR_LOGIN_SERVER}/${IMAGE_REPOSITORY}:latest"
