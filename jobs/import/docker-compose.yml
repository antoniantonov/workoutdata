services:
  import:
    build:
      context: ../..
      dockerfile: jobs/import/Dockerfile
    container_name: polar-import-job
    env_file:
      - .env
    volumes:
      # Mount tokens file for OAuth (resolved from repo root: jobs/import/tokens_polar.json)
      - ./tokens_polar.json:/app/jobs/import/tokens_polar.json
      # Mount local_data for DuckDB database and intermediate files (TCX/CSV)
      - ./local_data:/app/local_data
      # Mount Azure CLI credentials for Azure Storage authentication
      # Read-write because az CLI writes session files
      - ~/.azure:/root/.azure
    environment:
      - IN_CONTAINER=true
