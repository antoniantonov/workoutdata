[project]
name = "polar-raw-import"
version = "0.1.0"
description = "Raw import job for Polar AccessLink: Download TCX and convert to CSV"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "requests>=2.32.0",
    "python-dotenv>=1.0.0",
    "azure-storage-blob>=12.27.0",
    "azure-identity>=1.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
dev-dependencies = []

[project.scripts]
raw-import = "main:main"
