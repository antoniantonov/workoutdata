[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polar-workout-data"
version = "0.2.0"
description = "Polar AccessLink workout data toolkit for OAuth, data ingestion, and visualization"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Anton Antonov" }
]
keywords = [
    "polar",
    "workout",
    "heart-rate",
    "fitness",
    "accesslink",
    "duckdb",
    "postgresql"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Database",
]

dependencies = [
    "requests>=2.28.0",
    "pandas>=2.0.0",
    "plotly>=5.0.0",
    "duckdb>=0.9.0",
    "psycopg[binary]>=3.0.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
azure = [
    "azure-storage-blob>=12.0.0",
    "azure-identity>=1.0.0",
]
notebook = [
    "ipython>=8.0.0",
]
all = [
    "polar-workout-data[azure,notebook]",
]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "build>=1.0.0",
]

[project.urls]
Homepage = "https://github.com/tonkata/workoutdata"
Repository = "https://github.com/tonkata/workoutdata"
Documentation = "https://github.com/tonkata/workoutdata#readme"
Issues = "https://github.com/tonkata/workoutdata/issues"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.hatch.build.targets.sdist]
include = [
    "*.py",
    "api/*.py",
    "cloud/*.py",
    "converters/*.py",
    "ingest/*.py",
    "storage/*.py",
    "utils/*.py",
    "README.md",
    "LICENSE",
]
